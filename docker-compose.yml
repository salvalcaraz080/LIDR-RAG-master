# Docker Compose configuration for local development.
# For production, remove the bind mount and the --reload flag.

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  estimator:
    build: .
    container_name: estimator
    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./app:/app/app

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    restart: unless-stopped

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
      build:
        context: .
        dockerfile: frontend/Dockerfile
      container_name: frontend
      ports:
        - "8501:8501"

      # BACKEND_URL overrides the default to use the Compose service name.
      # Actually the default IS http://estimator:8000, so this is redundant —
      # but explicit is better than implicit for the next person reading this.
      environment:
        - BACKEND_URL=http://estimator:8000

      # Hot-reload: mount frontend source so code changes reflect without rebuild.
      # Mirrors the backend's bind-mount strategy.
      volumes:
        - ./frontend:/app/frontend

      # Don't start the frontend until the backend is healthy. Without this,
      # Streamlit could come up first and its first request would fail.
      depends_on:
        estimator:
          condition: service_healthy

      restart: unless-stopped